[project]
name = "secrets-sync"
version = "0.8.2"
description = "Commandline tool to pull secrets from multiple sources and push to AWS SSM and Secrets Manager with rate limiting."
authors = [
  { name = "Josh.5" }
]
readme = "README.md"
requires-python = ">=3.10"
# After changing dependencies, refresh uv.lock with: uv lock
dependencies = [
  "boto3>=1.41",
  "PyYAML>=6.0",
  "keepercommander>=17.1",
  "Jinja2>=3.1",
  "infisicalsdk>=1.0.3",
  "requests>=2.31"
]

[build-system]
requires = [
  "setuptools>=61",
  "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["secrets_sync*"]

[project.scripts]
secrets-sync = "secrets_sync.cli:main"
